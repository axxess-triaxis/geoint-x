[project]
name = "geointx"
version = "0.1.0"
description = "Geospatial change intelligence: land-use/land-cover change detection and wetland/government-land encroachment monitoring (NESFIC-D-21, NESFIC-D-17)."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "numpy>=2.0",
    "scipy>=1.14",
    "rasterio>=1.4",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pystac-client>=0.8",
    "sqlmodel>=0.0.22",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geointx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/geointx/api/reports.py" = ["E501"]
# Prompt text is kept verbatim on long lines.
"src/geointx/ai/*.py" = ["E501"]
"src/geointx/agent/strategy.py" = ["E501"]

# Vercel (serverless) deployment with Root Directory = backend. See server.py.
[tool.vercel]
entrypoint = "server:app"

[tool.vercel.scripts]
build = "python vercel_build.py"
